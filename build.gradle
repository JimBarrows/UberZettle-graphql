plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nsfwllc'
version = '0.0.1-SNAPSHOT'
description = 'UberZettle-graphql'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.3")
}

sourceSets {
    behaviorTest {
        compileClasspath += sourceSets.main.output + configurations.behaviorTestCompileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath + configurations.behaviorTestRuntimeClasspath
    }
}

configurations {
    behaviorTestImplementation.extendsFrom implementation, testImplementation
    behaviorTestRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
    behaviorTestCompileOnly.extendsFrom testCompileOnly
    behaviorTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.jetbrains:annotations:15.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    behaviorTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    behaviorTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    behaviorTestImplementation 'org.testcontainers:testcontainers-postgresql'
    behaviorTestImplementation platform('io.cucumber:cucumber-bom:7.34.7')
    behaviorTestImplementation 'io.cucumber:cucumber-junit-platform-engine'
    behaviorTestImplementation 'io.cucumber:cucumber-java'
    behaviorTestImplementation 'io.cucumber:cucumber-spring'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"

    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('behaviorTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'

    testClassesDirs = sourceSets.behaviorTest.output.classesDirs
    classpath = sourceSets.behaviorTest.runtimeClasspath
    shouldRunAfter test

    useJUnitPlatform()
    doFirst {
        println "behaviorTest runtime classpath:"
        classpath.files.each { println "  $it" }
        println "schema exists in build/resources/main: ${file('build/resources/main/graphql/schema.graphqls').exists()}"
    }
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

check.dependsOn behaviorTest

